<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iluminadores</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 40px;
  background: #fff;
}

h1 {
  text-align: center;
  margin-bottom: 50px;
  font-size: 32px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 40px;
  max-width: 1200px;
  margin: auto;
}

.card {
  border: 1px solid #eee;
  padding: 20px;
  text-align: center;
}

.card img {
  width: 100%;
  height: 280px;
  object-fit: contain;
  margin-bottom: 20px;
}

.title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 20px;
  min-height: 40px;
}

.buttons {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  padding: 12px;
  font-size: 14px;
  cursor: pointer;
}

.btn-outline {
  background: white;
  border: 1px solid black;
}

.btn-black {
  background: black;
  color: white;
  border: none;
}

.btn:hover {
  opacity: 0.85;
}
</style>
</head>

<body>

<h1>Iluminadores</h1>

<div class="grid">

  <div class="card">
    <img src="https://via.placeholder.com/400x400?text=Iluminador+1">
    <div class="title">Iluminador Forever Shimmerin’ Bratz</div>
    <div class="buttons">
      <button class="btn btn-outline">Detalles</button>
      <button class="btn btn-black">Lo quiero</button>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/400x400?text=Iluminador+2">
    <div class="title">Glow Stick Face & Body</div>
    <div class="buttons">
      <button class="btn btn-outline">Detalles</button>
      <button class="btn btn-black">Lo quiero</button>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/400x400?text=Iluminador+3">
    <div class="title">Iluminador Líquido Ultra Glow</div>
    <div class="buttons">
      <button class="btn btn-outline">Detalles</button>
      <button class="btn btn-black">Lo quiero</button>
    </div>
  </div>

</div>

</body>
</html>
