<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iluminadores</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Helvetica, Arial, sans-serif;
  background: #fff;
  color: #000;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 60px 20px;
}

h1 {
  text-align: center;
  font-size: 34px;
  font-weight: 600;
  margin-bottom: 60px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px;
}

.card {
  border: 1px solid #e5e5e5;
  padding: 30px 20px;
  text-align: center;
}

.image-box {
  width: 100%;
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 25px;
}

.image-box img {
  max-width: 100%;
  max-height: 100%;
}

.title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 25px;
  min-height: 38px;
}

.buttons {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  padding: 14px 0;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-outline {
  background: #fff;
  border: 1px solid #000;
}

.btn-outline:hover {
  background: #000;
  color: #fff;
}

.btn-black {
  background: #000;
  color: #fff;
  border: 1px solid #000;
}

.btn-black:hover {
  opacity: 0.85;
}

/* Responsive */
@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 600px) {
  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>Iluminadores</h1>

  <div class="grid">

    <div class="card">
      <div class="image-box">
        <img src="https://via.placeholder.com/300x300?text=Iluminador">
      </div>
      <div class="title">Iluminador Forever Shimmerin’ Bratz</div>
      <div class="buttons">
        <button class="btn btn-outline">Detalles</button>
        <button class="btn btn-black">Lo quiero</button>
      </div>
    </div>

    <div class="card">
      <div class="image-box">
        <img src="https://via.placeholder.com/300x300?text=Iluminador">
      </div>
      <div class="title">Glow Stick Face & Body</div>
      <div class="buttons">
        <button class="btn btn-outline">Detalles</button>
        <button class="btn btn-black">Lo quiero</button>
      </div>
    </div>

    <div class="card">
      <div class="image-box">
        <img src="https://via.placeholder.com/300x300?text=Iluminador">
      </div>
      <div class="title">Iluminador Líquido Ultra Glow</div>
      <div class="buttons">
        <button class="btn btn-outline">Detalles</button>
        <button class="btn btn-black">Lo quiero</button>
      </div>
    </div>

  </div>
</div>

</body>
</html>
