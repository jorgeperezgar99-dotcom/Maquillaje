<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iluminadores</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .card {
      border: 1px solid #eee;
      padding: 16px;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: auto;
    }

    .title {
      font-size: 14px;
      font-weight: 600;
      margin: 12px 0;
      min-height: 40px;
    }

    .buttons {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-outline {
      background: #fff;
      border: 1px solid #000;
    }

    .btn-black {
      background: #000;
      color: #fff;
      border: none;
    }
  </style>
</head>
<body>

<h1>Iluminadores</h1>

<div class="grid">

  <div class="card">
    <img src="https://dubellay.mx/cdn/shop/files/iluminador1.jpg" alt="">
    <div class="title">Iluminador Forever Shimmerin’ Bratz</div>
    <div class="buttons">
      <button class="btn btn-outline">Detalles</button>
      <button class="btn btn-black">Lo quiero</button>
    </div>
  </div>

  <div class="card">
    <img src="https://dubellay.mx/cdn/shop/files/iluminador2.jpg" alt="">
    <div class="title">Glow Stick Face & Body</div>
    <div class="buttons">
      <button class="btn btn-outline">Detalles</button>
      <button class="btn btn-black">Lo quiero</button>
    </div>
  </div>

  <div class="card">
    <img src="https://dubellay.mx/cdn/shop/files/iluminador3.jpg" alt="">
    <div class="title">Iluminador Líquido Ultra Glow</div>
    <div class="buttons">
      <button class="btn btn-outline">Detalles</button>
      <button class="btn btn-black">Lo quiero</button>
    </div>
  </div>

</div>

</body>
</html>
